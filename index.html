:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#192c46;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:20px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:24px;margin:0}h2{font-size:19px}small,.muted{color:#65748a}.card{background:white;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 15px #142e4d0b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stats .card{text-align:center;padding:14px 5px}.stats strong{display:block;font-size:23px;color:#1e478a}button{cursor:pointer;border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:650;background:#1d478c;color:white}button:disabled{opacity:.45}.secondary{background:#e9eff8;color:#234475}.outline{background:white;border:1px solid #d7e0eb;color:#203956}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{display:block;width:100%;text-align:left;margin:9px 0;background:#f7f9fc;border:2px solid #e2e8f1;color:#25364c;font-weight:450;line-height:1.5}.option.selected{border-color:#1e57ac;background:#e9f2ff}.option.correct{border-color:#17865e;background:#e6f8ee}.option.wrong{border-color:#b64b4b;background:#fff0ef}.stem{white-space:pre-wrap;line-height:1.8;font-size:15px}.explain{white-space:pre-wrap;line-height:1.7;background:#f1f6fb;padding:14px;border-radius:12px}.bar{height:8px;background:#e5eaf2;border-radius:12px;overflow:hidden}.bar>div{height:100%;background:#2b69bd}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.hidden{display:none}.tag{background:#e9eff8;color:#244875;border-radius:100px;padding:5px 10px;font-size:12px}.footer{font-size:12px;color:#65748a;margin-top:22px}.nav{display:flex;gap:8px;margin-top:16px}.nav button{flex:1}
